name: SDK check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - action.yml
      - sdk-assets.sha256
      - scripts/**
      - smoke/**
      - .github/workflows/sdk-check.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./
        id: sdk
      - name: Compile, link, check and sign PRX
        shell: bash
        run: bash scripts/smoke.sh
      - name: Upload smoke outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ps3dk-v0.28.0-prx-smoke-${{ github.run_id }}
          path: smoke-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Record setup result
        env:
          CACHE_HIT: ${{ steps.sdk.outputs.cache-hit }}
        run: printf 'SDK v0.28.0; prepared cache hit = %s\n' "$CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
